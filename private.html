<title>Private</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--ground:#fbfbfc;--rule:#d3d8de;--ink:#0d1117;--ink-2:#565f6c;--brass:#1b53ff;
    --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);
    font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  form{width:min(360px,100% - 56px)}
  .eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:14px}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent}
  button{font:500 15px var(--sans);padding:10px 16px;border:0;border-radius:4px;background:var(--ink);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #msg{min-height:1.6em;margin:10px 0 0;font-size:14px;color:var(--ink-2)}
</style>
<form id="f">
  <div class="eyebrow">Private</div>
  <div class="row">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required aria-label="Password">
    <button id="go">Enter</button>
  </div>
  <p id="msg" role="status"></p>
</form>

const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById("f"), pw = document.getElementById("pw"),
      go = document.getElementById("go"), msg = document.getElementById("msg");

async function decrypt(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(P.salt), iterations: P.iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(P.iv) }, key, unb64(P.ct));
  return new TextDecoder().decode(buf);
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true; msg.textContent = "Unlocking…";
  try {
    const html = await decrypt(pw.value);
    document.open(); document.write(html); document.close();
  } catch {
    msg.textContent = crypto.subtle ? "Wrong password." : "This page needs HTTPS.";
    go.disabled = false; pw.select();
  }
});
